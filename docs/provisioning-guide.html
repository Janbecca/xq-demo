<style>
#miya-wifi-chat{font:14px/1.5 system-ui,sans-serif;padding:10px 4px;--text:light-dark(#252e38,#edf3f6);--muted:light-dark(#5e7079,#bccad2);--white:light-dark(#fff,#25333b);--mint:light-dark(#daf6ed,#194a43);--green:light-dark(#007e70,#90e5d2);--line:light-dark(#dbe6eb,#52626a);color:var(--text)}
#miya-wifi-chat *{box-sizing:border-box}#miya-wifi-chat [hidden]{display:none!important}
#miya-wifi-chat .preview,#miya-wifi-chat .caption{max-width:404px;margin:0 auto 9px;color:var(--muted);font-size:12px}#miya-wifi-chat select{font:inherit;color:inherit;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:5px}
#miya-wifi-chat .phone{max-width:404px;margin:auto;background:linear-gradient(180deg,transparent 20%,light-dark(#f8f8f8,#182428) 88%),linear-gradient(105deg,light-dark(#c7ddf7,#1c3344),light-dark(#d7f1e7,#203932));border:1px solid var(--line);border-radius:22px;overflow:hidden}
#miya-wifi-chat header,#miya-wifi-chat .identity{display:flex;align-items:center;gap:8px;padding:10px 16px}#miya-wifi-chat header{justify-content:space-between;font-size:18px}#miya-wifi-chat button{font:inherit;color:var(--green);cursor:pointer}#miya-wifi-chat .plus,#miya-wifi-chat .exit{border:0;background:transparent;padding:4px}#miya-wifi-chat .plus{font-size:23px;color:var(--muted)}
#miya-wifi-chat .avatar{width:31px;height:31px;border-radius:50%}#miya-wifi-chat .identity b{font-size:17px}#miya-wifi-chat .identity span,#miya-wifi-chat .exit{font-size:12px;color:var(--muted)}#miya-wifi-chat .exit{margin-left:auto}
#miya-wifi-chat .stream{height:386px;overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none;scrollbar-width:thin;padding:12px 16px 18px}
#miya-wifi-chat .stream>*{margin:0 0 12px}#miya-wifi-chat .stream>:last-child{margin-bottom:0}
#miya-wifi-chat .bot,#miya-wifi-chat .user{width:fit-content;max-width:88%;padding:9px 12px;background:var(--white);border-radius:14px;position:relative;overflow-wrap:anywhere}
#miya-wifi-chat .user{margin-left:auto;background:var(--mint)}
#miya-wifi-chat .bot:before,#miya-wifi-chat .user:before{content:"";position:absolute;top:5px;left:-4px;border-top:8px solid var(--white);border-left:7px solid transparent;transform:rotate(12deg)}
#miya-wifi-chat .user:before{right:-4px;left:auto;border-top-color:var(--mint);transform:scaleX(-1) rotate(12deg)}
#miya-wifi-chat .event{font-size:12px;color:var(--muted);text-align:center}
#miya-wifi-chat .sheet{display:grid;gap:6px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
#miya-wifi-chat .media{display:flex;align-items:center;gap:12px}#miya-wifi-chat .media img{width:64px;height:62px;object-fit:contain}#miya-wifi-chat .media small{display:block;margin-top:4px;color:var(--muted)}
#miya-wifi-chat .dock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;position:relative;align-items:center;padding:8px 12px 12px}
#miya-wifi-chat .replies{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap}
#miya-wifi-chat .replies button,#miya-wifi-chat .sheet button,#miya-wifi-chat .latest{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:6px 10px;font-size:13px}
#miya-wifi-chat .latest{position:absolute;bottom:100%;right:14px}#miya-wifi-chat form{border-radius:24px;display:flex;align-items:center;padding:5px 6px 5px 15px;background:var(--white)}#miya-wifi-chat form input{min-width:0;flex:1;border:0;font:inherit;color:var(--text);background:transparent}#miya-wifi-chat form button{background:linear-gradient(110deg,#20b7ce,#0dbf99);color:white;border:0;border-radius:50%;width:31px;height:31px}#miya-wifi-chat .profile{display:grid;text-align:center;color:var(--green);font-size:11px}#miya-wifi-chat .profile span{font-size:19px}#miya-wifi-chat .caption{margin:9px auto 0}
</style>
<style>
#miya-wifi-chat{--label:light-dark(#175f53,#9de1d0);--wash:light-dark(#f2f8f6,#253c37);--hair:light-dark(#e7edeb,#3b504b);--ink:light-dark(#1e3230,#edf5f2);--chrome:light-dark(#fbfdfc,#273934);--quiet:light-dark(#516967,#bfd0cc);color:var(--ink)}
#miya-wifi-chat .stream{height:404px;padding-left:15px;padding-right:15px}
#miya-wifi-chat .sheet{display:block;position:relative;background:var(--white);border:1px solid light-dark(#cfe4db,#465d55);border-radius:17px;box-shadow:0 4px 13px #173d3010;padding:0;overflow:hidden}
#miya-wifi-chat .sheet h3{margin:0;color:var(--ink);font-size:17px;line-height:1.35;font-weight:650}
#miya-wifi-chat .head{padding:15px 16px 9px}
#miya-wifi-chat .sheet button{font-family:inherit;cursor:pointer;border:0;border-radius:0;background:transparent;line-height:1.4}
#miya-wifi-chat .sheet button:disabled{cursor:default}
#miya-wifi-chat .entry{padding:7px}
#miya-wifi-chat .entry .scan{position:relative;text-align:left;min-height:112px;width:100%;border-radius:12px;padding:18px 100px 18px 15px;background:linear-gradient(108deg,light-dark(#e3f5eb,#21423a),light-dark(#f0f9f5,#2d4c43));color:var(--ink);overflow:hidden}
#miya-wifi-chat .scan strong{display:block;font-size:21px;letter-spacing:.03em;font-weight:650;margin-bottom:5px}
#miya-wifi-chat .scan small,#miya-wifi-chat .line small{font-size:12px;color:var(--quiet);line-height:1.5}
#miya-wifi-chat .scanart{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:73px;height:73px;display:grid;place-items:center}
#miya-wifi-chat .scanart img{width:64px;height:64px;object-fit:contain;mix-blend-mode:multiply}
#miya-wifi-chat .scanart i{position:absolute;width:13px;height:13px;border-style:solid;border-color:var(--green);border-width:0}
#miya-wifi-chat .scanart i:nth-child(2){top:0;left:0;border-width:2px 0 0 2px;border-top-left-radius:5px}
#miya-wifi-chat .scanart i:nth-child(3){top:0;right:0;border-width:2px 2px 0 0;border-top-right-radius:5px}
#miya-wifi-chat .scanart i:nth-child(4){bottom:0;left:0;border-width:0 0 2px 2px;border-bottom-left-radius:5px}
#miya-wifi-chat .scanart i:nth-child(5){bottom:0;right:0;border-width:0 2px 2px 0;border-bottom-right-radius:5px}
#miya-wifi-chat .line{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:10px 0;text-align:left;color:var(--ink)}
#miya-wifi-chat .entry .line{padding:11px 13px 4px;min-height:54px}
#miya-wifi-chat .line strong,#miya-wifi-chat .line small{display:block}
#miya-wifi-chat .line strong{font-weight:550;font-size:15px}
#miya-wifi-chat .entry .line small{margin-top:2px}
#miya-wifi-chat .body{padding:0 16px}
#miya-wifi-chat .body .line+.line{border-top:1px solid var(--hair)}
#miya-wifi-chat .mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:var(--label);background:var(--wash);flex:none}
#miya-wifi-chat .networks .mark,#miya-wifi-chat .manual .mark{background:transparent;width:22px}
#miya-wifi-chat .devices small{font:12px/1.5 ui-monospace,monospace;letter-spacing:.04em}
#miya-wifi-chat .chev{margin-left:auto;font-size:19px;font-weight:400;color:var(--muted)}
#miya-wifi-chat .sheet .manual{color:var(--label);border-top:1px solid var(--hair);padding:10px 16px}
#miya-wifi-chat .sheet .manual strong{font-size:13px}
#miya-wifi-chat .device-head{display:flex;align-items:center;gap:7px;padding:6px 14px;min-height:42px;border-bottom:1px solid var(--hair);background:var(--chrome);font-size:12px;color:var(--quiet)}
#miya-wifi-chat .device-head strong{font-size:13px;color:var(--ink)}
#miya-wifi-chat .dot{width:7px;height:7px;border-radius:50%;background:#11aa88}
#miya-wifi-chat .sheet .switch-device,#miya-wifi-chat .sheet .change-net{font-size:12px;font-weight:550;color:var(--label);margin-left:auto;padding:7px 2px}
#miya-wifi-chat .line:disabled{color:var(--quiet)}
#miya-wifi-chat .locked .switch-device,#miya-wifi-chat .locked .change-net{display:none}
#miya-wifi-chat .sheet .picked .chev{color:var(--label)}
#miya-wifi-chat .formbody{padding:13px 16px 16px;display:grid;gap:12px}
#miya-wifi-chat .field{display:grid;gap:6px;text-align:left;margin:0;color:var(--quiet);font-size:12px}
#miya-wifi-chat .control{display:flex;align-items:center;gap:7px;border:1px solid var(--hair);border-radius:10px;background:var(--chrome);padding:5px 11px;min-height:43px}
#miya-wifi-chat .control:focus-within{border-color:var(--green)}
#miya-wifi-chat .control input{background:transparent;border:0;outline:0;min-width:0;flex:1;font:16px/1.45 system-ui;color:var(--ink)}
#miya-wifi-chat .control button{color:var(--label);font-size:12px;font-weight:550;padding:6px}
#miya-wifi-chat .formbody .connect{background:var(--green);color:var(--white);width:100%;border-radius:12px;padding:11px;font-size:15px;font-weight:600}
#miya-wifi-chat .formbody .connect:disabled{background:var(--wash);color:var(--quiet)}
#miya-wifi-chat .network-title{display:flex;align-items:center;gap:8px}
#miya-wifi-chat .network-title strong{overflow-wrap:anywhere;min-width:0;font-size:15px}
#miya-wifi-chat .icon{font-size:16px;line-height:1;display:inline-grid;place-items:center}
#miya-wifi-chat .icon svg{width:17px;height:17px}
#miya-wifi-chat .loading:before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--green);animation:miya-rotate .7s linear infinite}
@keyframes miya-rotate{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#miya-wifi-chat .loading:before{animation:none}}
#miya-wifi-chat .dock:has(form[hidden]) .profile{grid-column:2}
@media (prefers-color-scheme:dark){#miya-wifi-chat .scanart img{mix-blend-mode:normal;border-radius:14px}}
#miya-wifi-chat .device-head{min-height:67px;padding:8px 14px;gap:10px}
#miya-wifi-chat .device-thumb{display:grid;place-items:center;height:48px;width:48px;flex:none;border-radius:10px;background:var(--white);overflow:hidden}
#miya-wifi-chat .device-thumb img{display:block;width:100%;height:100%;object-fit:contain}
#miya-wifi-chat .device-meta{display:grid;gap:2px}
#miya-wifi-chat .device-meta strong{font-size:15px}
#miya-wifi-chat .link-state{display:flex;align-items:center;gap:5px;font-size:11px}
#miya-wifi-chat .scanart{width:52px;height:52px;right:20px}
#miya-wifi-chat .scanart .icon{font-size:26px;color:var(--label)}
#miya-wifi-chat .scanart .icon svg{width:26px;height:26px}
#miya-wifi-chat .replies{gap:6px;padding-bottom:2px}
#miya-wifi-chat .replies:empty{display:none}
#miya-wifi-chat .replies button,#miya-wifi-chat .jump-card{color:var(--label);font-size:12px;border:1px solid var(--line);background:var(--white);border-radius:18px;padding:7px 10px}
</style>
<script>
(()=>{
 const root=document.getElementById('miya-wifi-chat'), q=s=>root.querySelector(s);
 const feed=q('.stream'), latest=q('.latest'), composer=q('.dock form'), draft=q('.dock input');
 const devices=[{model:'S30',name:'S30_A2C1',ssids:['Home_WiFi','LivingRoom','Guest_Network']},{model:'N80',name:'N80_B7E4',ssids:['Home_WiFi','Studio','Guest_Network']}];
 let version=0, stage, route, device, follow=true;
 let lastTopic='';
 const el=(tag,cls='',text='')=>{const n=document.createElement(tag);n.className=cls;n.textContent=text;return n};
 function end(){feed.scrollTop=feed.scrollHeight;latest.hidden=true;follow=true}
 function align(){if(follow)end();else latest.hidden=false}
 feed.onscroll=()=>{follow=feed.scrollHeight-feed.clientHeight-feed.scrollTop<24;latest.hidden=follow};latest.onclick=end;
 function post(type,text=''){const n=el('div',type,text);feed.append(n);align();return n}
 const tips={
   entry:['二维码在哪里？','设备一直搜不到怎么办？'],
   busy:['设备一直搜不到怎么办？'],choose:['哪个是我的设备？','设备一直搜不到怎么办？'],
   linking:['设备没有反应？'],loadingWifi:['找不到我的 Wi-Fi','能连 5 GHz 吗？'],
   networks:['找不到我的 Wi-Fi','能连 5 GHz 吗？'],fields:['密码长度不够怎么办？','能连 5 GHz 吗？']
 };
 function stageTo(s){stage=s;composer.hidden=s==='home';q('.exit').hidden=s==='home';q('.plus').disabled=s!=='home';
   const strip=q('.replies');strip.replaceChildren();for(const t of tips[s]||[]){const b=el('button','',t);b.onclick=()=>ask(t);strip.append(b)}
 }
 function icon(name,fallback){const shell=el('span','icon');shell.setAttribute('aria-hidden','true');if(!globalThis.lucide)shell.textContent=fallback;else{const i=el('i');i.dataset.lucide=name;shell.append(i)}return shell}
 function polish(){globalThis.lucide?.createIcons({attrs:{width:17,height:17}});align()}
 function lock(box,chosen){box.classList.add('locked');for(const n of box.querySelectorAll('button,input')){n.disabled=true;if(n.dataset.password!==undefined){n.value='';n.type='password'}}if(chosen){chosen.classList.add('picked');const c=chosen.querySelector('.chev');if(c)c.textContent='✓'}}
 function pick(box,button,text,fn){button.onclick=()=>{lock(box,button);follow=true;post('user',text);fn()}}
 const pause=ms=>new Promise(ok=>setTimeout(ok,ms));
 async function reply(text,op){const bubble=post('bot');for(let i=0;i<text.length;i+=5){if(op!==version){if(bubble.isConnected)bubble.textContent=text;return false}bubble.textContent=text.slice(0,i+5);align();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)await pause(20)}return op===version}
 function line(box,parent,title,sub,symbol,fb,fn,extra=''){
   const b=el('button','line '+extra);b.type='button';b.dataset.choice=title;const mark=el('span','mark');mark.append(icon(symbol,fb));const words=el('span');words.append(el('strong','',title));if(sub)words.append(el('small','',sub));b.append(mark,words,el('span','chev','›'));parent.append(b);pick(box,b,title,fn);return b
 }
 function heading(box,title){const h=el('div','head');h.append(el('h3','',title));box.append(h)}
 function start(){version++;device=null;route='';lastTopic='';draft.value='';feed.replaceChildren();follow=true;stageTo('entry');post('bot','先给设备接上电。你可以扫机身上的二维码，也可以搜索附近的设备。');
   const box=post('sheet entry');const scan=el('button','scan');scan.dataset.choice='扫一扫';scan.append(el('strong','','扫一扫'),el('small','','扫描设备码，直接连接'));const art=el('span','scanart');art.append(icon('scan-line','⌗'));for(let i=0;i<4;i++)art.append(el('i'));scan.append(art);box.append(scan);
   pick(box,scan,'扫一扫',()=>{route='qr';connect(devices[0])});line(box,box,'直接搜索','查看附近的蓝牙设备','radar','◎',()=>{route='search';discover()});polish()
 }
 async function discover(){device=null;const op=++version;stageTo('busy');const ev=post('event loading','正在搜索附近设备…');await pause(450);if(op!==version)return;
   ev.classList.remove('loading');ev.textContent='搜索完成 · 发现 2 台设备';const box=post('sheet devices');heading(box,'附近的设备');const body=el('div','body');box.append(body);
   devices.forEach(d=>line(box,body,d.model,d.name,'bluetooth','ᛒ',()=>connect(d)));stageTo('choose');polish()
 }
 function deviceBar(box){const bar=el('div','device-head');const picture=el('span','device-thumb');
   const template=q('.photo-'+device.model.toLowerCase());if(template){picture.append(template.content.cloneNode(true));picture.firstElementChild.alt=device.model+' 设备图';bar.append(picture)}
   const summary=el('span','device-meta');summary.append(el('strong','',device.model));const state=el('span','link-state');state.append(el('span','dot'),document.createTextNode('蓝牙已连接'));summary.append(state);bar.append(summary);
   if(route==='search'){const swap=el('button','switch-device','重选设备');bar.append(swap);swap.onclick=()=>{lock(box);follow=true;post('user','重选设备');discover()}}
   box.append(bar);return bar
 }
 async function connect(d){const op=++version;device=d;stageTo('linking');
   if(route==='qr')post('event','扫码识别到 '+d.model);
   const ev=post('event loading','正在连接 '+d.model+'…');await pause(450);if(op!==version)return;
   ev.classList.remove('loading');ev.textContent='已通过蓝牙连接 '+d.model;stageTo('loadingWifi');
   if(!await reply('接下来，选一下你想让 '+d.model+' 使用的 Wi-Fi。',op))return;
   const box=post('sheet networks');deviceBar(box);const loading=el('div','head loading','正在读取设备的 Wi-Fi 列表…');box.append(loading);align();await pause(650);
   if(op!==version){if(loading.isConnected)loading.textContent='本次读取已结束';loading.classList.remove('loading');return}
   loading.remove();fillNetworks(box)
 }
 function fillNetworks(box){stageTo('networks');heading(box,'选择 Wi-Fi');const body=el('div','body');box.append(body);
   device.ssids.forEach(s=>line(box,body,s,'','wifi','◉',()=>fields(s)));line(box,box,'手动输入网络名称','','pencil-line','✎',()=>fields(''),'manual');polish()
 }
 function fields(ssid){stageTo('fields');const box=post('sheet fields');deviceBar(box);const form=el('div','formbody');box.append(form);form.append(el('h3','','连接 Wi-Fi'));
   const back=el('button','change-net','重选网络');pick(box,back,'重选网络',()=>{const network=post('sheet networks');deviceBar(network);fillNetworks(network)});
   let nameInput=null;
   if(ssid){const field=el('div','field','Wi-Fi 网络');const selected=el('div','network-title');selected.append(icon('wifi','◉'),el('strong','',ssid),back);field.append(selected);form.append(field)}
   else{const title=el('div','network-title');const label=el('label','field','Wi-Fi 名称');nameInput=el('input');nameInput.id='ssid-'+feed.childElementCount;nameInput.placeholder='输入网络名称（SSID）';label.htmlFor=nameInput.id;title.append(label,back);const wrap=el('div','control');wrap.append(nameInput);form.append(title,wrap)}
   const label=el('label','field','Wi-Fi 密码'),wrap=el('div','control'),pw=el('input');pw.id='password-'+feed.childElementCount;pw.dataset.password='';pw.type='password';pw.autocomplete='off';pw.placeholder='输入示例密码';label.htmlFor=pw.id;const eye=el('button','','显示');eye.onclick=()=>{pw.type=pw.type==='password'?'text':'password';eye.textContent=pw.type==='password'?'显示':'隐藏'};wrap.append(pw,eye);form.append(label,wrap);
   const submit=el('button','connect','连接');form.append(submit);const valid=()=>{submit.disabled=!(nameInput?nameInput.value.trim():ssid)||!pw.value};pw.oninput=valid;if(nameInput)nameInput.oninput=valid;valid();
   submit.onclick=()=>{lock(box);eye.textContent='显示';stageTo('finished');post('event','表单已填写 · 本次预览到这里')};polish()
 }
 q('.exit').onclick=()=>{version++;device=null;route='';draft.value='';feed.replaceChildren();stageTo('home');post('event','已退出配网')};q('.plus').onclick=start;
 function ask(text){
   const choice=Array.from(feed.querySelectorAll('[data-choice]:enabled')).find(b=>b.dataset.choice===text);
   if(choice){choice.click();return}
   const op=version, at=stage;follow=true;post('user',text);
   let answer;
   if(/二维码|在哪里扫/.test(text)) answer=device?'你现在连的是 '+device.model+'。可以先看机身铭牌上的设备码。':'你手边的设备是什么型号？告诉我型号，我再帮你找二维码的位置。';
   else if(/哪个|哪台/.test(text))answer='看型号下方的完整蓝牙名称。附近有同款设备时，可以扫手边这台设备的二维码来确认。';
   else if(/搜不到|找不到设备/.test(text))answer=device?'手机端先检查蓝牙和扫描权限。都正常的话，我们按 '+device.model+' 的配网说明核对设备状态。':'先检查手机蓝牙和扫描权限。都已开启的话，可以告诉我设备型号，或者扫一下机身二维码。';
   else if(/5\s*G|频段|2\.4/i.test(text))answer='是否支持 5 GHz 要看当前款型的频段资料。只凭 Wi-Fi 名称判断不准；这个预览还没有接入该型号的频段说明。';
   else if(/密码|长度/.test(text))answer='请在 Wi-Fi 表单里填写路由器的完整密码，留意大小写。若表单提示长度不足，请按原密码核对，密码只填在密码栏。';
   else if(/找不到|没有.*网|隐藏/.test(text)&&['fields','networks','loadingWifi'].includes(at))answer='列表里是设备自己扫到的网络。如果看不到家里的 Wi-Fi，可以点列表最后的「手动输入网络名称」，填入完整名称。';
   else if(/没有反应|没反应/.test(text))answer='先看看设备上的指示灯或屏幕有没有变化。蓝牙是否连上，以这次连接的 App 回执为准。';
   else if(lastTopic==='qr'&&/^(S30|N80)$/i.test(text))answer='记下了，你手边的是 '+text.toUpperCase()+'。可以先看机身铭牌，找到设备码后点「扫一扫」。';
   else if(lastTopic==='device'&&/^(S30|N80)$/i.test(text))answer='记下了，你手边的是 '+text.toUpperCase()+'。请按随附说明确认设备已进入配网状态，再点「直接搜索」。';
   else answer=at==='fields'?'你现在是在填写网络名称还是密码时遇到了问题？':at==='networks'?'你是看不到想连的 Wi-Fi，还是想确认这个网络的频段？':'你是找不到设备二维码，还是蓝牙列表里没有这台设备？';
   lastTopic=/二维码|在哪里扫/.test(text)?'qr':/搜不到|找不到设备/.test(text)?'device':'';
   reply(answer,op).then(ok=>{if(!ok||at!==stage)return;const box=[...feed.querySelectorAll('.sheet:not(.locked)')].at(-1);
     if(!box)return;const back=el('button','jump-card',at==='fields'?'回到 Wi-Fi 表单':at==='networks'?'回到 Wi-Fi 列表':at==='entry'?'回到添加设备':at==='choose'?'回到设备列表':'回到当前卡片');
     back.onclick=()=>{follow=false;box.scrollIntoView({block:'nearest'});latest.hidden=false};feed.append(back);align()
   })
 }
 composer.onsubmit=e=>{e.preventDefault();const t=draft.value.trim();if(!t)return;draft.value='';ask(t)};

 start()
})();
</script>
</body>
</html>
